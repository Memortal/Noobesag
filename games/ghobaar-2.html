<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>غبار ۲ | نوب سگ</title>
<meta name="description" content="بازی غبار ۲، یک بازی اکشن سه‌بعدی ایرانی. نسخه جدید را آنلاین در نوب سگ تجربه کنید.">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#151515;color:#eee;font-family:Tahoma,Arial,sans-serif}main{min-height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}h1{font-size:32px;margin:0 0 16px}p{font-size:13px;color:#bbb;line-height:2}#bar{height:3px;background:#383838;width:min(320px,76vw);margin:22px auto;overflow:hidden}#fill{height:100%;width:0;background:#ccc;transition:width .2s}button{color:#171717;background:#ccc;border:0;padding:12px 25px;cursor:pointer}#error{display:none;color:#e4baba}
</style>
</head>
<body>
<main id="loading"><div><h1>غبار ۲</h1><p>در حال بارگذاری نسخه ۳۰… <span id="progress">۰٪</span></p><div id="bar"><div id="fill"></div></div><p id="error"></p></div></main>
<noscript>برای اجرای بازی، جاوااسکریپت را فعال کنید.</noscript>
<script>
(async function(){
  const count=26;
  let loaded=0;
  const progress=document.getElementById('progress');
  const fill=document.getElementById('fill');
  try{
    const parts=await Promise.all(Array.from({length:count},async(_,i)=>{
      const path='./ghobaar-v30-assets/part-'+String(i).padStart(2,'0')+'.txt';
      const response=await fetch(path,{cache:'default'});
      if(!response.ok)throw new Error('Could not load '+path+' ('+response.status+')');
      const chunk=await response.text();
      loaded++;
      const percent=Math.round(loaded/count*100);
      progress.textContent=percent+'٪';
      fill.style.width=percent+'%';
      return chunk;
    }));
    const html=parts.join('');
    if(!html.startsWith('<!DOCTYPE html>')||!html.includes('data-build="30"')||!html.trimEnd().endsWith('</html>'))throw new Error('Game build validation failed');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error('Ghobaar 2 v30 failed to load',error);
    document.getElementById('error').style.display='block';
    document.getElementById('error').textContent='بارگذاری بازی ناموفق بود. اینترنت را بررسی کنید و صفحه را دوباره باز کنید.';
    const button=document.createElement('button');
    button.textContent='تلاش دوباره';
    button.onclick=()=>location.reload();
    document.getElementById('error').after(button);
  }
})();
</script>
</body>
</html>

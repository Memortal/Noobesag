<style>

#mainmenu{position:absolute;inset:0;z-index:50;background:radial-gradient(ellipse at 25% 50%,#27403b 0,#111c21 55%,#0c171d 100%);display:flex;align-items:center;justify-content:center;padding:40px;overflow:auto}#mainmenu:before{content:'';position:absolute;inset:17px;border:1px solid #cda86650;pointer-events:none}#mainmenu:after{content:'';position:absolute;inset:23px;border:1px dotted #cda86650;pointer-events:none}.menuLayout{max-width:1110px;width:100%;display:grid;grid-template-columns:1.18fr .82fr;gap:95px;position:relative;align-items:center}.menuCopy{padding:15px 0}.menuCopy h1{font-size:54px;line-height:1.5;font-weight:normal;margin:10px 0 0;letter-spacing:-2px}.menuCopy h2{font-size:17px;font-weight:normal;color:var(--gold);margin:0 0 22px}.menuCopy .intro{font-size:13px;max-width:470px;color:#b5bdb0;line-height:2.15}.menuForm{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin:22px 0 15px}.menuForm label{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:8px}.menuForm select,.menuForm input{width:100%;font-size:12px}.menuActions{display:flex;gap:8px;margin-top:18px}.menuActions button{font-size:12px;padding:13px 17px}.menuActions .gold{flex:1}.menuLinks{display:flex;gap:8px;margin-top:10px}.menuLinks button{border:none;font-size:10px;padding:6px;color:var(--muted)}.artFrame{position:relative;max-width:375px;transform:rotate(-3deg);border:1px solid #d8b876;padding:8px;background:#162324;box-shadow:0 30px 90px #0008;outline:1px solid #cda86635;outline-offset:7px}.artFrame img{width:100%;display:block;max-height:62vh;object-fit:cover}.artCaption{transform:rotate(3deg);text-align:center;color:var(--gold);font-size:11px;margin-top:25px;line-height:1.9}.artCaption span{display:block;color:#9fa99d;font-size:9px;margin-top:7px}.menuSeal{width:50px;height:50px;border:1px solid var(--gold);transform:rotate(45deg);display:flex;align-items:center;justify-content:center;margin-bottom:30px}.menuSeal svg{width:30px;height:30px;transform:r function morphChildren(live,fresh){
 const desired=Array.from(fresh.childNodes);
 for(let i=0;i<desired.length;i++){
  const next=desired[i],old=live.childNodes[i];
  if(!old){live.append(next);continue}
  if(old.nodeType!==next.nodeType||old.nodeName!==next.nodeName){live.replaceChild(next,old);continue}
  if(old.nodeType===3){if(old.nodeValue!==next.nodeValue)old.nodeValue=next.nodeValue;continue}
  for(const a of Array.from(old.attributes))if(!next.hasAttribute(a.name))old.removeAttribute(a.name);
  for(const a of Array.from(next.attributes))if(old.getAttribute(a.name)!==a.value)old.setAttribute(a.name,a.value);
  old.onclick=next.onclick;old.onchange=next.onchange;
  morphChildren(old,next);
 }
 while(live.childNodes.length>desired.length)live.lastChild.remove();
}

 });

const battleCommandBefore=commandWorld,battleIntentBefore=commandIntent;
commandIntent=function(hit,point){const bs=ownSelection('building').filter(b=>B[b.type]?.damage&&b.progress>=1);if(!ownSelection('unit').length&&bs.length&&hit?.team===1&&hit.kind==='unit'){
 const b=bs[0],stats=UI.sim.defenseStats(b),bad=UI.sim.s.peace>0?'peaceActive':UI.sim.distance(UI.sim.center(b),hit)>stats.range?'targetOutOfRange':!UI.sim.lineOfFire(b,hit)?'lineBlocked':null;
 return{kind:bad?'blocked':'attack',key:bad||'hintTowerFocus',target:hit};}return battleIntentBefore(hit,point);};
commandWorld=function(point,hit=null,attack=false,append=false){
 const bs=ownSelection('building').filter(b=>B[b.type]?.damage&&b.progress>=1);
 if(!ownSelection('unit').length&&bs.length&&hit?.team===1&&hit.kind==='unit'){
  let count=0,err=null;for(const b of bs){const answer=UI.sim.setDefense(b,'focus',hit.id);if(answer)err=answer;else count++;}
  if(count)acknowledge(point,'attack',count,hit.id);else if(err)toast(err);renderUI(true);return count;
 }
 return battleCommandBefore(point,hit,attack,append);
};

function showWallOutcome(r){
 if(!r){toast('netRejected');return;}
 const n=r.built?.length||0,counts={};for(const e of r.results||[])if(e.reason)counts[e.reason]=(counts[e.reason]||0)+1;

 toast(n?'wallsPlaced':'wallsNone',text);UI.ack={kind:n?'build':'blocked',text,time:performance.now()};updateCommandRibbon();
}
